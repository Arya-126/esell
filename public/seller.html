<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seller · ReWear</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/app.js"></script>
  <script>renderNav('');</script>

  <div class="container" id="root"><div class="empty">Loading…</div></div>

  <script>
    const id = new URLSearchParams(location.search).get('id');
    (async () => {
      try {
        const [{ user, listings, reviews }] = await Promise.all([api('/auth/users/' + id), Currency.ready]);
        const avg = reviews.length ? (reviews.reduce((s, r) => s + r.rating, 0) / reviews.length).toFixed(1) : null;
        document.getElementById('root').innerHTML = `
          <a href="index.html" class="muted">← Marketplace</a>
          <div class="card" style="margin:14px 0">
            <div class="row between wrap">
              <div class="row" style="gap:14px">
                <div class="avatar-circle" style="width:60px;height:60px;font-size:26px">${esc(user.name[0].toUpperCase())}</div>
                <div>
                  <h1 style="margin:0">${esc(user.name)}</h1>
                  <div>${trustBadge(user.trustScore)} ${avg ? `· ⭐ ${avg} (${reviews.length} reviews)` : '· no reviews yet'}</div>
                  <div class="muted" style="font-size:13px">Member since ${new Date(user.createdAt).toLocaleDateString()} · 🌱 saved ${user.ecoImpact || 0}kg CO₂ as a buyer</div>
                </div>
              </div>
            </div>
            ${user.bio ? `<p style="margin-top:14px">${esc(user.bio)}</p>` : ''}
          </div>

          <h2>Active listings (${listings.length})</h2>
          <div class="grid">${listings.map((p) => `
            <div class="product" onclick="location.href='product.html?id=${p.id}'">
              <div class="thumb">${(p.thumb || p.image) ? `<img src="${p.thumb || p.image}" loading="lazy">` : '🖼️'}</div>
              <div class="body"><div class="title">${esc(p.title)}</div><div class="price">${money(p.price)}</div></div>
            </div>`).join('') || '<p class="muted">No active listings.</p>'}</div>

          <h2 style="margin-top:28px">Reviews</h2>
          ${reviews.length ? reviews.map((r) => `
            <div class="card" style="margin-bottom:10px">
              <div class="row between"><strong>${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</strong><span class="muted" style="font-size:12px">${esc(r.reviewer)} · ${timeAgo(r.createdAt)}</span></div>
              ${r.comment ? `<p style="margin:6px 0 0">${esc(r.comment)}</p>` : ''}
            </div>`).join('') : '<p class="muted">No reviews yet.</p>'}`;
      } catch (e) {
        document.getElementById('root').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
