<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sell an item · ReWear</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/app.js"></script>
  <script>renderNav('sell.html'); requireLogin();</script>

  <div class="container" style="max-width:680px">
    <h1>List an item for sale</h1>
    <p class="muted">Add a clear photo, an honest description and a fair price. We'll show buyers how much CO₂ they'll save.</p>
    <script>
      if (Auth.user && !Auth.user.verified && Auth.user.role !== 'admin') {
        document.write('<div class="card" style="border-color:var(--warn)">✉️ <strong>Verify your email to publish listings.</strong> Use the “Verify now” button in the banner above.</div>');
      }
    </script>

    <div class="card" style="margin-top:18px">
      <form id="form">
        <label>Photo</label>
        <input type="file" id="image" accept="image/*" />
        <div id="preview" style="margin-top:10px"></div>

        <label>Title *</label>
        <input id="title" placeholder="e.g. Vintage leather armchair" maxlength="120" required />

        <div class="row" style="gap:14px">
          <div style="flex:1">
            <label id="priceLabel">Price *</label>
            <input id="price" type="number" min="0" step="0.01" placeholder="45" required />
            <div class="muted" id="priceHint" style="font-size:12px;margin-top:4px"></div>
          </div>
          <div style="flex:1">
            <label>Category *</label>
            <select id="category"></select>
          </div>
          <div style="flex:1">
            <label>Condition</label>
            <select id="condition"></select>
          </div>
        </div>

        <label>Location (optional)</label>
        <input id="location" placeholder="Brooklyn, NY" maxlength="80" />

        <label>Description</label>
        <textarea id="description" placeholder="Tell buyers about the item, its history, any flaws..." maxlength="4000"></textarea>

        <div id="fairHint" class="muted" style="font-size:13px;margin-top:10px"></div>

        <button class="btn" type="submit" id="submitBtn" style="margin-top:18px">Publish listing</button>
      </form>
    </div>
  </div>

  <script>
    let CATS = [];
    (async () => {
      const [{ categories, conditions }] = await Promise.all([api('/products'), Currency.ready]);
      CATS = categories;
      document.getElementById('category').innerHTML = categories.map((c) => `<option>${c}</option>`).join('');
      document.getElementById('condition').innerHTML = conditions.map((c) => `<option ${c === 'Good' ? 'selected' : ''}>${c}</option>`).join('');

      // Sellers enter their price in their own currency; the catalog stores
      // USD and converts live for every viewer.
      document.getElementById('priceLabel').textContent = `Price (${Currency.code}) *`;
      if (Currency.code !== 'USD') {
        const hint = document.getElementById('priceHint');
        const update = () => {
          const v = Number(document.getElementById('price').value);
          const rate = Currency.data.rates[Currency.code] || 1;
          hint.textContent = v > 0 ? `≈ $${(v / rate).toFixed(2)} USD — buyers worldwide see it in their own currency` : '';
        };
        document.getElementById('price').addEventListener('input', update);
      }
    })();

    document.getElementById('image').onchange = (e) => {
      const f = e.target.files[0];
      const prev = document.getElementById('preview');
      if (!f) { prev.innerHTML = ''; return; }
      const url = URL.createObjectURL(f);
      prev.innerHTML = `<img src="${url}" style="max-height:200px;border-radius:10px;border:1px solid var(--border)" />`;
    };

    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData();
      const file = document.getElementById('image').files[0];
      if (file) fd.append('image', file);
      fd.append('title', document.getElementById('title').value);
      fd.append('price', document.getElementById('price').value);
      fd.append('currency', Currency.code);
      fd.append('category', document.getElementById('category').value);
      fd.append('condition', document.getElementById('condition').value);
      fd.append('location', document.getElementById('location').value);
      fd.append('description', document.getElementById('description').value);

      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Publishing...';
      try {
        const { product } = await api('/products', { method: 'POST', form: fd });
        toast('Listing published! 🎉');
        setTimeout(() => (location.href = 'product.html?id=' + product.id), 600);
      } catch (err) {
        toast(err.message, true);
        btn.disabled = false; btn.textContent = 'Publish listing';
      }
    };
  </script>
</body>
</html>
