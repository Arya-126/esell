<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout · ReWear</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/app.js"></script>
  <script>renderNav(''); requireLogin();</script>

  <div class="container" style="max-width:760px" id="root"><div class="empty">Loading checkout…</div></div>

  <script>
    // Supports two flows: ?order=<id> (Buy Now / accepted offer) and
    // ?group=<id> (cart checkout — many orders, one payment).
    const orderId = new URLSearchParams(location.search).get('order');
    const groupId = new URLSearchParams(location.search).get('group');

    let ORDERS = [], TOTAL = null, CONFIG = null, ADDRESSES = [], stripe = null, stripeElements = null;

    const apiBase = () => (groupId ? `/orders/group/${groupId}` : `/orders/${orderId}`);

    async function load() {
      try {
        const [checkout, config, { addresses }] = await Promise.all([
          groupId ? api(apiBase()) : api(apiBase()).then(({ order }) => ({
            orders: [order],
            currency: order.currency,
            total: order.amountInCurrency,
            totalUsd: order.amount,
            totalFormatted: order.charged,
          })),
          api('/config'),
          api('/auth/addresses').catch(() => ({ addresses: [] })),
          Currency.ready,
        ]);
        ORDERS = checkout.orders;
        TOTAL = checkout;
        CONFIG = config;
        ADDRESSES = addresses || [];
        const pending = ORDERS.filter((o) => o.status === 'pending_payment');
        if (!pending.length) return done(ORDERS, false);
        render();
        if (CONFIG.stripeEnabled) await initStripe();
      } catch (e) { document.getElementById('root').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
    }

    function addressOptions() {
      if (!ADDRESSES.length) return '';
      return `<label>Use a saved address</label>
        <select id="savedAddr" onchange="fillAddress()">
          <option value="">— New address —</option>
          ${ADDRESSES.map((a) => `<option value="${a.id}" ${a.isDefault ? 'selected' : ''}>${esc(a.name)} · ${esc(a.line1)}, ${esc(a.city)}</option>`).join('')}
        </select>`;
    }

    function itemLine(o) {
      const p = o.product || {};
      return `<div class="row between" style="gap:12px;margin-bottom:10px">
        <div class="row" style="gap:10px">
          ${p.thumb || p.image ? `<img src="${p.thumb || p.image}" style="width:48px;height:48px;border-radius:8px;object-fit:cover">` : ''}
          <div><strong style="font-size:14px">${esc(p.title || 'Item')}</strong>
          <div class="muted" style="font-size:12px">Sold by ${esc(o.sellerName)}</div></div>
        </div>
        <span>${esc(o.charged)}</span>
      </div>`;
    }

    function render() {
      const pending = ORDERS.filter((o) => o.status === 'pending_payment');
      const def = ADDRESSES.find((a) => a.isDefault) || {};
      const cur = TOTAL.currency || 'USD';
      document.getElementById('root').innerHTML = `
        <a href="${groupId ? 'cart.html' : 'dashboard.html'}" class="muted" id="backLink" style="cursor:pointer">← Cancel & go back</a>
        <h1 style="margin-top:10px">Checkout ${groupId ? `<span class="tag eco">🛒 ${pending.length} item${pending.length > 1 ? 's' : ''}</span>` : ''}</h1>
        <div class="row wrap" style="align-items:flex-start;gap:20px">
          <div style="flex:1;min-width:300px">
            <div class="card">
              <h2>Shipping address</h2>
              ${addressOptions()}
              <label>Full name</label><input id="s_name" value="${esc(def.name || Auth.user?.name || '')}" />
              <label>Address</label><input id="s_line1" value="${esc(def.line1 || '')}" placeholder="123 Main St, Apt 4" />
              <div class="row" style="gap:12px">
                <div style="flex:2"><label>City</label><input id="s_city" value="${esc(def.city || '')}" placeholder="Brooklyn" /></div>
                <div style="flex:1"><label>ZIP</label><input id="s_zip" value="${esc(def.zip || '')}" placeholder="11201" /></div>
              </div>
              <label>Country</label><input id="s_country" value="${esc(def.country || '')}" placeholder="USA" />
              <label style="display:flex;gap:8px;align-items:center;margin-top:12px;cursor:pointer">
                <input type="checkbox" id="saveAddr" style="width:auto" ${ADDRESSES.length ? '' : 'checked'}> Save this address for next time
              </label>
            </div>

            <div class="card" style="margin-top:16px">
              <h2>Payment ${CONFIG.stripeEnabled
                ? '<span class="tag" style="background:rgba(98,114,255,.18);color:#8a9bff">Stripe</span>'
                : '<span class="tag" style="background:rgba(74,163,255,.16);color:var(--accent)">🔒 Demo — no real charge</span>'}</h2>
              <div id="paymentArea">${CONFIG.stripeEnabled ? '<div id="payment-element"></div><div class="muted" id="stripeStatus" style="font-size:12px;margin-top:6px">Loading secure payment…</div>' : stubCardForm()}</div>
            </div>
          </div>

          <div style="flex:1;min-width:260px">
            <div class="card">
              <h2>Order summary</h2>
              ${pending.map(itemLine).join('')}
              <div class="row between"><span class="muted">Shipping</span><span>Free</span></div>
              <hr style="border-color:var(--border);margin:12px 0">
              <div class="row between" style="font-size:18px"><strong>Total</strong><strong style="color:var(--brand)">${esc(TOTAL.totalFormatted)}</strong></div>
              <div class="muted" style="font-size:12px;text-align:right">${usdHint(TOTAL.totalUsd)}</div>
              ${cur !== 'USD' ? `<p class="muted" style="font-size:12px;margin-top:8px">💱 You'll be charged in <strong>${cur}</strong> — rate locked when this checkout was created.</p>` : ''}
              <button class="btn" id="payBtn" style="width:100%;margin-top:16px">Pay ${esc(TOTAL.totalFormatted)}</button>
              <p class="muted" style="font-size:12px;text-align:center;margin-top:8px">🌱 Reused items save CO₂ vs buying new.</p>
            </div>
          </div>
        </div>`;
      document.getElementById('payBtn').onclick = pay;
      if (groupId) document.getElementById('backLink').onclick = cancelGroup;
    }

    async function cancelGroup(e) {
      e.preventDefault();
      try { await api(`/orders/group/${groupId}/cancel`, { method: 'POST' }); } catch { /* already resolved */ }
      location.href = 'index.html';
    }

    function stubCardForm() {
      return `<label>Card number</label><input id="c_number" placeholder="4242 4242 4242 4242" inputmode="numeric" />
        <div class="row" style="gap:12px">
          <div style="flex:1"><label>Expiry (MM/YY)</label><input id="c_exp" placeholder="12/29" /></div>
          <div style="flex:1"><label>CVC</label><input id="c_cvc" placeholder="123" inputmode="numeric" /></div>
        </div>
        <p class="muted" style="font-size:12px;margin-top:8px">Test card: <strong>4242 4242 4242 4242</strong>, any future expiry, any CVC.</p>`;
    }

    function fillAddress() {
      const id = document.getElementById('savedAddr').value;
      const a = ADDRESSES.find((x) => x.id === id);
      if (!a) return;
      document.getElementById('s_name').value = a.name || '';
      document.getElementById('s_line1').value = a.line1 || '';
      document.getElementById('s_city').value = a.city || '';
      document.getElementById('s_zip').value = a.zip || '';
      document.getElementById('s_country').value = a.country || '';
      document.getElementById('saveAddr').checked = false;
    }

    // ----- Stripe (only when configured). The PaymentIntent is created in the
    // buyer's currency for the locked converted amount. -----
    async function initStripe() {
      await loadScript('https://js.stripe.com/v3/');
      stripe = Stripe(CONFIG.stripePublishableKey);
      const { clientSecret } = await api(`${apiBase()}/payment-intent`, { method: 'POST' });
      stripeElements = stripe.elements({ clientSecret, appearance: { theme: 'night', variables: { colorPrimary: '#2ecc71' } } });
      stripeElements.create('payment').mount('#payment-element');
      document.getElementById('stripeStatus').textContent = 'Enter your card — test mode card 4242 4242 4242 4242.';
    }
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script'); s.src = src; s.onload = resolve; s.onerror = reject; document.head.appendChild(s);
      });
    }

    function shippingPayload() {
      return { name: val('s_name'), line1: val('s_line1'), city: val('s_city'), zip: val('s_zip'), country: val('s_country') };
    }
    const val = (id) => document.getElementById(id).value.trim();

    async function pay() {
      const btn = document.getElementById('payBtn');
      const shipping = shippingPayload();
      if (!shipping.name || !shipping.line1 || !shipping.city || !shipping.zip) return toast('Complete your shipping address', true);
      const saveAddress = document.getElementById('saveAddr')?.checked;
      btn.disabled = true; btn.textContent = 'Processing…';
      try {
        let body = { shipping, saveAddress };
        if (CONFIG.stripeEnabled) {
          const { error } = await stripe.confirmPayment({ elements: stripeElements, redirect: 'if_required' });
          if (error) throw new Error(error.message);
          // PaymentIntent confirmed; server will verify amount + currency.
        } else {
          body.card = { number: val('c_number'), exp: val('c_exp'), cvc: val('c_cvc') };
        }
        const result = await api(`${apiBase()}/pay`, { method: 'POST', body });
        done(result.orders || [result.order], true);
      } catch (e) {
        toast(e.message, true);
        btn.disabled = false; btn.textContent = `Pay ${TOTAL.totalFormatted}`;
      }
    }

    function done(orders, justPaid) {
      const paid = orders.filter((o) => o.status !== 'cancelled');
      const first = paid[0] || orders[0];
      const totalLine = paid.length > 1
        ? `${paid.length} items · ${esc(TOTAL?.totalFormatted || '')}`
        : `Order #${first.id} · ${esc(first.charged)} · ${esc(first.product?.title || '')}`;
      document.getElementById('root').innerHTML = `
        <div class="card" style="text-align:center;max-width:520px;margin:30px auto">
          <div style="font-size:54px">🎉</div>
          <h1>${justPaid ? 'Payment successful!' : 'Order ' + first.status}</h1>
          <p class="muted">${totalLine}</p>
          ${first.payment ? `<p class="muted">Paid with ${first.payment.brand} •••• ${first.payment.last4}${first.currency && first.currency !== 'USD' ? ` · charged in ${first.currency}` : ''}</p>` : ''}
          <p>The seller${paid.length > 1 ? 's have' : ' has'} been notified to ship your item${paid.length > 1 ? 's' : ''}.</p>
          <div class="row wrap" style="justify-content:center;gap:10px;margin-top:8px">
            ${paid.map((o) => `<button class="btn ghost sm" onclick="downloadAuthed('/orders/${o.id}/receipt','receipt-${o.id}.pdf')">⬇ Receipt${paid.length > 1 ? ' · ' + esc((o.product?.title || '').slice(0, 18)) : ' (PDF)'}</button>`).join('')}
            <a class="btn" href="transactions.html">My orders →</a>
          </div>
        </div>`;
    }

    load();
  </script>
</body>
</html>
