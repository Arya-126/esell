<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · ReWear</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <script src="js/app.js"></script>
  <div class="container" style="max-width:440px">
    <div style="text-align:center;margin:30px 0">
      <a class="brand" href="index.html" style="font-size:30px">Re<span>Wear</span></a>
      <p class="muted">Buy & sell pre-loved goods. Save money, save the planet. 🌍</p>
    </div>

    <div class="card">
      <div class="tabs">
        <button id="tabLogin" class="active" onclick="switchTab('login')">Login</button>
        <button id="tabReg" onclick="switchTab('register')">Create account</button>
      </div>

      <form id="form">
        <div id="nameField" style="display:none">
          <label>Full name</label>
          <input id="name" placeholder="Jane Doe" autocomplete="name" />
        </div>
        <label>Email</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
        <label>Password</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
        <button class="btn" style="width:100%;margin-top:20px" id="submitBtn" type="submit">Login</button>
      </form>
      <p class="muted" style="font-size:12px;margin-top:14px;text-align:center">
        Tip: the very first account created becomes the site admin.
      </p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    if (Auth.isLoggedIn) location.href = 'index.html';
    let mode = 'login';
    const params = new URLSearchParams(location.search);
    const next = params.get('next') || 'index.html';

    function switchTab(m) {
      mode = m;
      document.getElementById('tabLogin').classList.toggle('active', m === 'login');
      document.getElementById('tabReg').classList.toggle('active', m === 'register');
      document.getElementById('nameField').style.display = m === 'register' ? 'block' : 'none';
      document.getElementById('submitBtn').textContent = m === 'register' ? 'Create account' : 'Login';
    }

    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      try {
        const path = mode === 'register' ? '/auth/register' : '/auth/login';
        const body = mode === 'register' ? { name, email, password } : { email, password };
        const { token, user } = await api(path, { method: 'POST', body });
        Auth.set(token, user);
        toast(`Welcome${user.name ? ', ' + user.name : ''}! 👋`);
        setTimeout(() => (location.href = next), 500);
      } catch (err) {
        toast(err.message, true);
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
