<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart · ReWear</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/app.js"></script>
  <script>renderNav('cart.html'); requireLogin();</script>

  <div class="container" style="max-width:860px" id="root"><div class="empty">Loading cart…</div></div>

  <script>
    let CART = null;

    async function load() {
      try {
        const [cart] = await Promise.all([api('/cart'), Currency.ready]);
        CART = cart;
        render();
      } catch (e) { document.getElementById('root').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
    }

    function render() {
      const root = document.getElementById('root');
      if (!CART.items.length) {
        root.innerHTML = `<div class="empty" style="margin-top:40px">
          <div style="font-size:50px">🛒</div>
          <h2>Your cart is empty</h2>
          <p class="muted">Every item here is one of a kind — grab it before someone else does.</p>
          <a class="btn" href="index.html">Browse the marketplace →</a>
        </div>`;
        return;
      }
      root.innerHTML = `
        <h1>🛒 Your cart</h1>
        <p class="muted">${CART.count} item${CART.count > 1 ? 's' : ''} · prices shown in ${CART.currency}</p>
        <div class="row wrap" style="align-items:flex-start;gap:20px">
          <div style="flex:2;min-width:320px">
            ${CART.items.map((i) => itemRow(i)).join('')}
          </div>
          <div style="flex:1;min-width:260px">
            <div class="card">
              <h2>Summary</h2>
              <div class="row between"><span class="muted">Items (${CART.count})</span><span>${esc(CART.totalFormatted)}</span></div>
              <div class="row between"><span class="muted">Shipping</span><span>Free</span></div>
              <hr style="border-color:var(--border);margin:12px 0">
              <div class="row between" style="font-size:18px"><strong>Total</strong><strong style="color:var(--brand)">${esc(CART.totalFormatted)}</strong></div>
              <div class="muted" style="font-size:12px;text-align:right">${usdHint(CART.totalUsd)}</div>
              <button class="btn" id="checkoutBtn" style="width:100%;margin-top:16px">Checkout →</button>
              <p class="muted" style="font-size:12px;text-align:center;margin-top:8px">One payment covers all items. Each seller ships separately.</p>
            </div>
          </div>
        </div>`;
      document.getElementById('checkoutBtn').onclick = checkout;
    }

    function itemRow(i) {
      const p = i.product;
      return `<div class="card" style="margin-bottom:10px">
        <div class="row between wrap" style="gap:12px">
          <div class="row" style="gap:12px;cursor:pointer" onclick="location.href='product.html?id=${p.id}'">
            ${(p.thumb || p.image) ? `<img src="${p.thumb || p.image}" style="width:62px;height:62px;border-radius:9px;object-fit:cover">` : '<div style="font-size:30px">🖼️</div>'}
            <div>
              <strong>${esc(p.title)}</strong>
              <div class="muted" style="font-size:13px">${esc(p.condition)} · ${esc(p.category)} · sold by ${esc(p.sellerName)}</div>
            </div>
          </div>
          <div class="row" style="gap:14px;align-items:center">
            <strong>${money(p.price)}</strong>
            <button class="btn ghost sm" onclick="removeItem('${p.id}')">✕ Remove</button>
          </div>
        </div>
      </div>`;
    }

    async function removeItem(productId) {
      try {
        CART = await api('/cart/' + productId, { method: 'DELETE' });
        refreshCartBadge();
        render();
      } catch (e) { toast(e.message, true); }
    }

    async function checkout() {
      const btn = document.getElementById('checkoutBtn');
      btn.disabled = true; btn.textContent = 'Reserving items…';
      try {
        const { groupId } = await api('/cart/checkout', { method: 'POST' });
        refreshCartBadge();
        location.href = 'checkout.html?group=' + groupId;
      } catch (e) {
        toast(e.message, true);
        btn.disabled = false; btn.textContent = 'Checkout →';
        load(); // an item may have just sold — refresh the cart
      }
    }

    load();
  </script>
</body>
</html>
